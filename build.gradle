plugins {
    id 'java'
    id 'idea'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    unitTestImplementation.extendsFrom implementation
    unitTestRuntimeOnly.extendsFrom runtimeOnly
    integrationTestImplementation.extendsFrom implementation
    integrationTestRuntimeOnly.extendsFrom runtimeOnly
    apiE2ETestImplementation.extendsFrom implementation
    apiE2ETestRuntimeOnly.extendsFrom runtimeOnly
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'

    unitTestImplementation 'org.springframework.boot:spring-boot-starter-test'
    unitTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    unitTestRuntimeOnly 'com.h2database:h2'

    integrationTestImplementation 'org.springframework.boot:spring-boot-starter-test'
    integrationTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    integrationTestRuntimeOnly 'com.h2database:h2'

    apiE2ETestImplementation 'org.springframework.boot:spring-boot-starter-test'
    apiE2ETestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    apiE2ETestImplementation 'io.rest-assured:rest-assured:5.3.1'
    apiE2ETestImplementation 'com.github.mwiede:jsch:0.2.22'

    // AWS SDK v2 BOM (버전은 예시)
    implementation platform("software.amazon.awssdk:bom:2.25.50")
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3:3.0.2'

    // S3 클라이언트
    implementation "software.amazon.awssdk:s3"

    // URLConnection 기반 HTTP 클라이언트 (현재 코드에서 사용)
    implementation 'software.amazon.awssdk:url-connection-client'

    // swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'

    // 이메일
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // sms
    implementation 'net.nurigo:sdk:4.2.7'

    // jwt
    implementation group: 'io.jsonwebtoken', name: 'jjwt-api', version: '0.11.2'
    runtimeOnly group: 'io.jsonwebtoken', name: 'jjwt-impl', version: '0.11.2'
    runtimeOnly group: 'io.jsonwebtoken', name: 'jjwt-jackson', version: '0.11.2'

    // redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // 웹소켓
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // firebase
    implementation 'com.google.firebase:firebase-admin:9.4.3'
    implementation group: 'com.squareup.okhttp3', name: 'okhttp', version: '4.12.0'

    // elasticsearch
    implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'
    implementation 'co.elastic.clients:elasticsearch-java:8.17.0'

    //oauth2
    implementation group: 'org.springframework.security', name: 'spring-security-oauth2-client'

    // retry
    implementation 'org.springframework.retry:spring-retry:2.0.8'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'io.micrometer:micrometer-core'
    implementation 'org.apache.commons:commons-lang3:3.14.0'
}

sourceSets {
    unitTest {
        java {
            srcDir 'src/test_unit/java'
        }
        resources {
            srcDir 'src/test/resources'  // test의 resources 공유
        }
        compileClasspath += main.output + test.compileClasspath
        runtimeClasspath += main.output + test.runtimeClasspath
    }
    integrationTest {
        java {
            srcDir 'src/test_integration/java'
        }
        resources {
            srcDir 'src/test/resources'  // test의 resources 공유
        }
        compileClasspath += main.output + test.compileClasspath
        runtimeClasspath += main.output + test.runtimeClasspath
    }
    apiE2ETest {
        java {
            srcDir 'src/test_apiE2E/java'
        }
        resources {
            srcDir 'src/test/resources'  // test의 resources 공유
        }
        compileClasspath += main.output + test.compileClasspath
        runtimeClasspath += main.output + test.runtimeClasspath
    }
}

tasks.register('unitTest', Test) {
    description = '단위 테스트 실행 (도메인 로직, Mock 기반)'
    group = 'verification'
    testClassesDirs = sourceSets.unitTest.output.classesDirs
    classpath = sourceSets.unitTest.runtimeClasspath
    useJUnitPlatform()

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
}

tasks.register('integrationTest', Test) {
    description = '통합 테스트 실행 (@SpringBootTest, 전체 컨텍스트)'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }

    shouldRunAfter unitTest
}

tasks.register('apiE2ETest', Test) {
    testClassesDirs = sourceSets.apiE2ETest.output.classesDirs
    classpath = sourceSets.apiE2ETest.runtimeClasspath
    shouldRunAfter integrationTest

    useJUnitPlatform()
}

check.dependsOn unitTest
check.dependsOn integrationTest
check.dependsOn apiE2ETest

/* =======================
   🔥 CI에서 Lombok 깨짐 방지 (필수)
 ======================= */
tasks.withType(JavaCompile).configureEach {
    options.annotationProcessorPath = configurations.annotationProcessor
}

/* =======================
   IntelliJ IDEA 커스텀 소스셋 인식
 ======================= */
idea {
    module {
        testSources.from(sourceSets.unitTest.java.srcDirs)
        testSources.from(sourceSets.integrationTest.java.srcDirs)
        testSources.from(sourceSets.apiE2ETest.java.srcDirs)
        testResources.from(sourceSets.unitTest.resources.srcDirs)
        testResources.from(sourceSets.integrationTest.resources.srcDirs)
        testResources.from(sourceSets.apiE2ETest.resources.srcDirs)
    }
}